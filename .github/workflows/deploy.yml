name: Deploy URL Shortener to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Hetzner and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            if [ ! -d "/root/url-shortener" ]; then
              git clone https://github.com/emmmik/url-shortener.git /root/url-shortener
            fi

            cd /root/url-shortener
            git fetch origin main
            git reset --hard origin/main

            docker compose down

            docker compose up -d --build
